<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Процедурный персонаж · слоёные позы</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 18px; left: 18px;
    font: 13px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #0a4b52; letter-spacing: .02em; user-select: none; pointer-events: none;
  }
  #hud .state {
    font-size: 20px; font-weight: 700; color: #2c7fb6;
    letter-spacing: .04em; text-transform: uppercase;
  }
  #hud .state small {
    font-size: 13px; font-weight: 500; color: #5a8ba8;
    text-transform: none; letter-spacing: 0; margin-left: 6px;
  }
  #hud .keys { margin-top: 6px; font-size: 11.5px; color: #5a8ba8; }
  #hud .keys b { color: #0a4b52; }
</style>
</head>
<body>
<div id="hud">
  <div class="state" id="hud-state">idle</div>
  <div class="keys">
    <b>0</b> стоит<br>
    <b>1–5</b> ходьба: обычная · прогулка · строевой · пружинистая · семенящая<br>
    <b>6–9</b> бег: трусца · спринт · широкий шаг · высокое колено<br>
    <b>Space</b> прыжок · <b>+/−</b> масштаб · <b>R</b> сброс
  </div>
</div>

<!-- shared rig; classic script so it loads under file:// (see the module's header) -->
<script src="./main_person.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   СЦЕНА / КАМЕРА / СВЕТ (метры)
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(2.07, 1.62, 3.33);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8775, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 1.44;
controls.maxDistance = 8.1;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0xa9cfc9, 2.2));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
keyLight.position.set(2.25, 4.05, 2.7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.45;
keyLight.shadow.camera.far  = 13.5;
keyLight.shadow.camera.left   = -2.7;
keyLight.shadow.camera.right  =  2.7;
keyLight.shadow.camera.top    =  3.6;
keyLight.shadow.camera.bottom = -0.9;
keyLight.shadow.bias = -0.0008;
keyLight.shadow.normalBias = 0.009;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x4ade80, 1.2);
rimLight.position.set(-2.7, 1.8, -3.15);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.9);
fillLight.position.set(-2.25, 1.125, 2.7);
scene.add(fillLight);

const shadowCatcher = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 18),
  new THREE.ShadowMaterial({ color: 0x2c7fb6, opacity: 0.18 })
);
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);

/* ============================================================
   ГЕРОЙ — общий риг из assets/main_person.js
   ============================================================ */
const hero = MainPerson.createHero({ THREE, RoundedBoxGeometry });
scene.add(hero.group);

const b = hero.rig;
const P = hero.P;

/* ============================================================
   СОСТОЯНИЕ + HUD
   ============================================================ */
let state = 'idle';
let variant = 0;
let prevState = 'idle';
let prevVariant = 0;
let jumpT = 0;
let scale = 1.0;                     // workbench-only zoom; the module's P does not carry it
const JUMP_DUR = 1.5;
const BLEND_IN  = 0.18;
const BLEND_OUT = 0.20;

const hudState = document.getElementById('hud-state');

function updateHud() {
  if (state === 'idle') {
    hudState.textContent = 'idle';
  } else if (state === 'walk') {
    hudState.innerHTML = 'walk <small>· ' + hero.WALKS[variant].name + '</small>';
  } else if (state === 'run') {
    hudState.innerHTML = 'run <small>· ' + hero.RUNS[variant].name + '</small>';
  } else {
    hudState.textContent = 'jump';
  }
}

function setMode(nextState, nextVariant = 0) {
  if (state === 'jump') return;
  state = nextState;
  variant = nextVariant;
  prevState = nextState;
  prevVariant = nextVariant;
  updateHud();
}

function startJump() {
  if (state === 'jump') return;
  prevState = state;
  prevVariant = variant;
  state = 'jump';
  jumpT = 0;
  updateHud();
}

/* ============================================================
   ВЫБОР ПОЗЫ И СЛОЕНИЕ
   ============================================================ */
function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function computePoseFor(stateName, variantIdx, t) {
  if (stateName === 'idle') return hero.poseIdle(t);
  if (stateName === 'walk') return hero.poseGait(t, hero.WALKS[variantIdx], false);
  if (stateName === 'run')  return hero.poseGait(t, hero.RUNS[variantIdx],  true);
  return hero.emptyPose();
}

function animateCharacter(t, dt) {
  let pose;

  if (state === 'jump') {
    jumpT += dt;
    const phase = Math.min(1, jumpT / JUMP_DUR);

    const basePose = computePoseFor(prevState, prevVariant, t);
    const jumpPose = hero.poseJump(phase);

    const wIn  = smoothstep(0, BLEND_IN, jumpT);
    const wOut = smoothstep(0, BLEND_OUT, JUMP_DUR - jumpT);
    pose = hero.lerpPose(basePose, jumpPose, Math.min(wIn, wOut));

    if (phase >= 1) {
      jumpT = 0;
      state = prevState;
      variant = prevVariant;
      updateHud();
    }
  } else {
    pose = computePoseFor(state, variant, t);
  }

  hero.applyPose(pose);
  hero.breathe(t, dt);                // breath + blink, folded into one call
}

/* ============================================================
   УПРАВЛЕНИЕ
   ============================================================ */
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); startJump(); return; }
  if (e.key === '0') { setMode('idle'); return; }
  if (e.key >= '1' && e.key <= '5') { setMode('walk', parseInt(e.key, 10) - 1); return; }
  if (e.key >= '6' && e.key <= '9') { setMode('run',  parseInt(e.key, 10) - 6); return; }

  if (e.key === '+' || e.key === '=') {
    scale = Math.min(2.0, scale + 0.1);
    b.body.scale.setScalar(scale);
  }
  if (e.key === '-' || e.key === '_') {
    scale = Math.max(0.4, scale - 0.1);
    b.body.scale.setScalar(scale);
  }
  if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
    scale = 1.0;
    b.body.scale.setScalar(scale);
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let lastT = 0;

renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  animateCharacter(t, dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
