<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Процедурный персонаж · слоёные позы</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 18px; left: 18px;
    font: 13px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #0a4b52; letter-spacing: .02em; user-select: none; pointer-events: none;
  }
  #hud .state {
    font-size: 20px; font-weight: 700; color: #2c7fb6;
    letter-spacing: .04em; text-transform: uppercase;
  }
  #hud .state small {
    font-size: 13px; font-weight: 500; color: #5a8ba8;
    text-transform: none; letter-spacing: 0; margin-left: 6px;
  }
  #hud .keys { margin-top: 6px; font-size: 11.5px; color: #5a8ba8; }
  #hud .keys b { color: #0a4b52; }
</style>
</head>
<body>
<div id="hud">
  <div class="state" id="hud-state">idle</div>
  <div class="keys">
    <b>0</b> стоит<br>
    <b>1–5</b> ходьба: обычная · прогулка · строевой · пружинистая · семенящая<br>
    <b>6–9</b> бег: трусца · спринт · широкий шаг · высокое колено<br>
    <b>Space</b> прыжок · <b>+/−</b> масштаб · <b>R</b> сброс
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================================================
   ПАРАМЕТРЫ ПЕРСОНАЖА
   Все размеры — в МЕТРАХ.
   Оригинальный дизайн был в условных юнитах (рост ≈ 4.0),
   коэффициент перевода: 1 юнит = 0.45 м → рост ≈ 1.80 м.
   ============================================================ */
const P = {
  scale: 1.0,
  hipX: 0.1035,            // 0.23 юнита
  shoulderX: 0.216,        // 0.48 юнита
  y: {
    ankle: 0.189,          // 0.42
    knee: 0.4275,          // 0.95
    hip: 0.81,             // 1.80
    wrist: 0.774,          // 1.72
    elbow: 0.99,           // 2.20
    shoulder: 1.2375,      // 2.75
    chest: 1.035,          // 2.30
    neck: 1.3275,          // 2.95
    head: 1.5975           // 3.55
  },
  r: {
    thighTop: 0.09,        // 0.200
    thighBot: 0.0765,      // 0.170
    knee: 0.0765,          // 0.170
    shinTop: 0.07425,      // 0.165
    shinBot: 0.063,        // 0.140
    shoulder: 0.0855,      // 0.190
    upperArmTop: 0.06975,  // 0.155
    upperArmBot: 0.063,    // 0.140
    elbow: 0.0675,         // 0.150
    foreArmTop: 0.063,     // 0.140
    foreArmBot: 0.054,     // 0.120
    hand: 0.0675,          // 0.150
    neckTop: 0.0675,       // 0.150
    neckBot: 0.07875,      // 0.175
    head: [0.342, 0.369, 0.351],   // 0.76 × 0.82 × 0.78
    hair: [0.369, 0.153, 0.378],   // 0.82 × 0.34 × 0.84
    eye: 0.0405,           // 0.090
    pupil: 0.0171,         // 0.038
    irisR: 0.02475,        // 0.055
    irisT: 0.0054          // 0.012
  },
  torso: [
    [0.783,  0.846,  0.189,  0.189,  'puffer'],  // 1.74 – 1.88
    [0.846,  1.125,  0.189,  0.207,  'puffer'],  // 1.88 – 2.50
    [1.125,  1.323,  0.207,  0.135,  'puffer'],  // 2.50 – 2.94
    [1.323,  1.395,  0.135,  0.1215, 'puffer']   // 2.94 – 3.10
  ],
  torsoLimeY: [1.224, 1.278, 0.17775],           // 2.72, 2.84, 0.395
  torsoHood: { r: 0.189, y: 1.251, z: -0.099, thetaLen: 0.78, tilt: -0.35 },
  torsoPocket: { w: 0.225, h: 0.117, d: 0.09, y: 0.936, z: 0.171 },
  zipper: { yFrom: 1.008, yTo: 1.30725, step: 0.0297, size: [0.0225, 0.0279, 0.0225] },
  drawstrings: { x: 0.05625, y: 1.188, z: 0.1935, len: 0.216, tilt: -0.58,
                 tipY: 1.098, tipZ: 0.2529, r: 0.0099, tipR: 0.0189 },
  face: {
    eyeX: 0.072,    eyeY: 0.009,    eyeZ: 0.18,
    pupilZ: 0.2115, irisZ: 0.216,
    browY: 0.072,   browZ: 0.189,   browSize: [0.0765, 0.02025, 0.027], browTilt: 0.12,
    noseY: -0.027,  noseZ: 0.198,   noseR: 0.0225, noseH: 0.054,
    mouthY: -0.0945, mouthZ: 0.189, mouthSize: [0.072, 0.0135, 0.0225],
    hairY: 0.1575,  hairZ: -0.0135
  },
  shoe: {
    soleW: 0.153,  soleH: 0.0495, soleD: 0.279,
    upperW: 0.135, upperD: 0.207, upperZ: -0.009,
    toeR: 0.0675,  toeZ: 0.09,
    heelW: 0.117,  heelH: 0.0585, heelD: 0.045, heelZ: -0.10575,
    lace: { w: 0.0855, h: 0.01575, d: 0.0225, count: 3, spread: 0.03825, startZ: -0.063 }
  }
};

const L = {
  thigh: P.y.hip - P.y.knee, shin: P.y.knee - P.y.ankle,
  upperArm: P.y.shoulder - P.y.elbow, foreArm: P.y.elbow - P.y.wrist
};

/* ============================================================
   КОНФИГИ ПОХОДОК И БЕГА
   ============================================================ */
const WALKS = [
  { name: 'обычная',      freq: 5.0, hipAmp: 0.55, kneeAmp: 0.70, baseKnee: 0.05,
    armAmp: 0.50, elbowBase: -0.28, elbowFlex: 0.35,
    lean: 0.00, bob: 0.045, hipTwist: 0.06, bodyTwist: 0.08, footRoll: 0.15 },
  { name: 'прогулка',     freq: 3.2, hipAmp: 0.36, kneeAmp: 0.48, baseKnee: 0.06,
    armAmp: 0.26, elbowBase: -0.20, elbowFlex: 0.22,
    lean: 0.00, bob: 0.028, hipTwist: 0.04, bodyTwist: 0.05, footRoll: 0.10 },
  { name: 'строевой',     freq: 4.5, hipAmp: 0.80, kneeAmp: 0.95, baseKnee: 0.10,
    armAmp: 0.90, elbowBase: -0.55, elbowFlex: 0.60,
    lean: 0.00, bob: 0.070, hipTwist: 0.03, bodyTwist: 0.04, footRoll: 0.18 },
  { name: 'пружинистая',  freq: 5.5, hipAmp: 0.62, kneeAmp: 0.85, baseKnee: 0.06,
    armAmp: 0.60, elbowBase: -0.32, elbowFlex: 0.40,
    lean: 0.02, bob: 0.095, hipTwist: 0.07, bodyTwist: 0.09, footRoll: 0.16 },
  { name: 'семенящая',    freq: 7.8, hipAmp: 0.32, kneeAmp: 0.55, baseKnee: 0.08,
    armAmp: 0.28, elbowBase: -0.40, elbowFlex: 0.30,
    lean: 0.02, bob: 0.020, hipTwist: 0.05, bodyTwist: 0.06, footRoll: 0.22 },
];

const RUNS = [
  { name: 'трусца',         freq: 9.5,  hipAmp: 0.95, kneeAmp: 0.85, baseKnee: 0.08,
    armAmp: 1.05, elbowBase: -0.85, elbowFlex: 0.55,
    lean: -0.14, bob: 0.085, hipTwist: 0.10, bodyTwist: 0.14, footRoll: 0.20 },
  { name: 'спринт',         freq: 12.5, hipAmp: 1.10, kneeAmp: 1.00, baseKnee: 0.10,
    armAmp: 1.25, elbowBase: -1.00, elbowFlex: 0.65,
    lean: -0.28, bob: 0.110, hipTwist: 0.12, bodyTwist: 0.16, footRoll: 0.24 },
  { name: 'широкий шаг',    freq: 8.0,  hipAmp: 1.15, kneeAmp: 0.70, baseKnee: 0.06,
    armAmp: 0.85, elbowBase: -0.70, elbowFlex: 0.45,
    lean: -0.10, bob: 0.095, hipTwist: 0.14, bodyTwist: 0.18, footRoll: 0.18 },
  { name: 'высокое колено', freq: 10.5, hipAmp: 1.25, kneeAmp: 1.00, baseKnee: 0.25,
    armAmp: 1.10, elbowBase: -1.05, elbowFlex: 0.60,
    lean: -0.05, bob: 0.100, hipTwist: 0.08, bodyTwist: 0.10, footRoll: 0.28 },
];

/* ============================================================
   ПАЛИТРА / МАТЕРИАЛЫ
   ============================================================ */
const COL = {
  puffer: 0x2c7fb6, lime: 0x4ade80, olive: 0x0a4b52, sole: 0x1e6f9a,
  hair: 0x2a1a12, skin: 0xecc4a4, white: 0xf2f2f0, ink: 0x15181a
};
const std = (c, o = {}) =>
  new THREE.MeshStandardMaterial({ color: c, roughness: 0.62, metalness: 0.04, ...o });

const M = {
  puffer: std(COL.puffer, { roughness: 0.72 }),
  hood:   std(COL.puffer, { roughness: 0.72, side: THREE.DoubleSide }),
  lime:   std(COL.lime,   { roughness: 0.55, emissive: 0x1a5a28, emissiveIntensity: 0.18 }),
  olive:  std(COL.olive,  { roughness: 0.85 }),
  sole:   std(COL.sole,   { roughness: 0.62 }),
  hair:   std(COL.hair,   { roughness: 0.55 }),
  skin:   std(COL.skin,   { roughness: 0.55 }),
  white:  std(COL.white,  { roughness: 0.45 }),
  ink:    std(COL.ink,    { roughness: 0.35 })
};

/* ============================================================
   ГЕОМЕТРИЯ
   ============================================================ */
const SPH = (r, w = 28, h = 20) => new THREE.SphereGeometry(r, w, h);
const CYL = (rt, rb, h, s = 24) => new THREE.CylinderGeometry(rt, rb, h, s);
const BOX = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const TOR = (r, t, s = 12, ts = 36) => new THREE.TorusGeometry(r, t, s, ts);
const CON = (r, h, s = 20) => new THREE.ConeGeometry(r, h, s);

function addTo(parent, geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
function addLimb(parent, length, rTop, rBot, mat) {
  return addTo(parent, CYL(rTop, rBot, length), mat, 0, -length / 2, 0);
}
function addTorsoSection(parent, yB, yT, rB, rT, mat, chestWorldY) {
  return addTo(parent, CYL(rT, rB, yT - yB), mat, 0, (yB + yT) / 2 - chestWorldY, 0);
}

/* ============================================================
   СЦЕНА / КАМЕРА / СВЕТ (в метрах)
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(2.07, 1.62, 3.33);           // было (4.6, 3.6, 7.4) · 0.45

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8775, 0);               // было (0, 1.95, 0) · 0.45
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 1.44;                     // было 3.2 · 0.45
controls.maxDistance = 8.1;                      // было 18  · 0.45
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0xa9cfc9, 2.2));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
keyLight.position.set(2.25, 4.05, 2.7);          // было (5, 9, 6) · 0.45
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.45;              // было 1   · 0.45
keyLight.shadow.camera.far  = 13.5;              // было 30  · 0.45
keyLight.shadow.camera.left   = -2.7;            // было -6  · 0.45
keyLight.shadow.camera.right  =  2.7;            // было  6  · 0.45
keyLight.shadow.camera.top    =  3.6;            // было  8  · 0.45
keyLight.shadow.camera.bottom = -0.9;            // было -2  · 0.45
keyLight.shadow.bias = -0.0008;                  // без изменений (глубинная величина)
keyLight.shadow.normalBias = 0.009;              // было 0.02 · 0.45
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x4ade80, 1.2);
rimLight.position.set(-2.7, 1.8, -3.15);         // было (-6, 4, -7) · 0.45
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.9);
fillLight.position.set(-2.25, 1.125, 2.7);       // было (-5, 2.5, 6) · 0.45
scene.add(fillLight);

const shadowCatcher = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 18),               // было 40 × 40 · 0.45
  new THREE.ShadowMaterial({ color: 0x2c7fb6, opacity: 0.18 })
);
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);

/* ============================================================
   СКЕЛЕТ
   ============================================================ */
const b = {};
b.body = new THREE.Group();
b.body.scale.setScalar(P.scale);
scene.add(b.body);

const relY = (a, b2) => a - b2;

b.hips  = new THREE.Group(); b.hips.position.y  = P.y.hip; b.body.add(b.hips);
b.chest = new THREE.Group(); b.chest.position.y = relY(P.y.chest, P.y.hip); b.hips.add(b.chest);
b.neck  = new THREE.Group(); b.neck.position.y  = relY(P.y.neck, P.y.chest); b.chest.add(b.neck);
b.head  = new THREE.Group(); b.head.position.y  = relY(P.y.head, P.y.neck); b.neck.add(b.head);

b.upL = new THREE.Group(); b.upL.position.set(-P.shoulderX, relY(P.y.shoulder, P.y.chest), 0); b.chest.add(b.upL);
b.upR = new THREE.Group(); b.upR.position.set( P.shoulderX, relY(P.y.shoulder, P.y.chest), 0); b.chest.add(b.upR);
b.foL = new THREE.Group(); b.foL.position.y = -L.upperArm; b.upL.add(b.foL);
b.foR = new THREE.Group(); b.foR.position.y = -L.upperArm; b.upR.add(b.foR);
b.hdL = new THREE.Group(); b.hdL.position.y = -L.foreArm; b.foL.add(b.hdL);
b.hdR = new THREE.Group(); b.hdR.position.y = -L.foreArm; b.foR.add(b.hdR);

b.hipL  = new THREE.Group(); b.hipL.position.set(-P.hipX, 0, 0); b.hips.add(b.hipL);
b.hipR  = new THREE.Group(); b.hipR.position.set( P.hipX, 0, 0); b.hips.add(b.hipR);
b.shinL = new THREE.Group(); b.shinL.position.y = -L.thigh; b.hipL.add(b.shinL);
b.shinR = new THREE.Group(); b.shinR.position.y = -L.thigh; b.hipR.add(b.shinR);
b.ftL   = new THREE.Group(); b.ftL.position.y = -L.shin; b.shinL.add(b.ftL);
b.ftR   = new THREE.Group(); b.ftR.position.y = -L.shin; b.shinR.add(b.ftR);

/* ============================================================
   МЕШИ
   ============================================================ */
for (const side of [-1, 1]) {
  const hip = side < 0 ? b.hipL : b.hipR;
  const shn = side < 0 ? b.shinL : b.shinR;
  const ft  = side < 0 ? b.ftL : b.ftR;

  addLimb(hip, L.thigh, P.r.thighTop, P.r.thighBot, M.olive);
  addTo(shn, SPH(P.r.knee), M.olive, 0, 0, 0);
  addLimb(shn, L.shin, P.r.shinTop, P.r.shinBot, M.olive);
  addTo(ft, SPH(P.r.shinBot + 0.0045, 18, 14), M.puffer, 0, 0, 0);

  const S = P.shoe;
  const yBase = -P.y.ankle;
  const upperH = P.y.ankle - S.soleH;

  addTo(ft, BOX(S.soleW, S.soleH, S.soleD), M.sole, 0, yBase + S.soleH / 2, 0);
  addTo(ft, BOX(S.upperW, upperH, S.upperD), M.puffer,
        0, yBase + S.soleH + upperH / 2, S.upperZ);

  const toe = addTo(ft, SPH(S.toeR, 22, 16), M.puffer,
                    0, yBase + S.soleH + upperH * 0.35, S.toeZ);
  toe.scale.set(1, 0.82, 1);

  addTo(ft, BOX(S.heelW, S.heelH, S.heelD), M.puffer,
        0, yBase + S.soleH + upperH * 0.75, S.heelZ);

  for (let i = 0; i < S.lace.count; i++) {
    addTo(ft, BOX(S.lace.w, S.lace.h, S.lace.d), M.lime,
          0, yBase + S.soleH + upperH - 0.0135,
          S.lace.startZ + i * S.lace.spread);
  }
}

for (const [yB, yT, rB, rT, key] of P.torso) {
  addTorsoSection(b.chest, yB, yT, rB, rT, M[key], P.y.chest);
}
{
  const [yB, yT, r] = P.torsoLimeY;
  addTorsoSection(b.chest, yB, yT, r, r, M.lime, P.y.chest);
}
addTo(b.neck, CYL(P.r.neckTop, P.r.neckBot, 0.18), M.skin, 0, 0, 0);

{
  const H = P.torsoHood;
  const hood = addTo(b.chest,
    new THREE.SphereGeometry(H.r, 32, 22, 0, Math.PI * 2, 0, Math.PI * H.thetaLen),
    M.hood, 0, H.y - P.y.chest, H.z);
  hood.rotation.x = H.tilt;
}
{
  const K = P.torsoPocket;
  addTo(b.chest, BOX(K.w, K.h, K.d), M.puffer, 0, K.y - P.y.chest, K.z);
}

function torsoRadius(y) {
  for (const [yB, yT, rB, rT] of P.torso) {
    if (y >= yB && y <= yT) return rB + (rT - rB) * ((y - yB) / (yT - yB));
  }
  return P.torso[P.torso.length - 1][3];
}
{
  const Z = P.zipper;
  for (let y = Z.yFrom; y <= Z.yTo; y += Z.step) {
    addTo(b.chest, BOX(...Z.size), M.lime, 0, y - P.y.chest, torsoRadius(y) - 0.0036);
  }
}
{
  const D = P.drawstrings;
  for (const s of [-1, 1]) {
    const str = addTo(b.chest, CYL(D.r, D.r, D.len), M.white,
                      s * D.x, D.y - P.y.chest, D.z);
    str.rotation.x = D.tilt;
    addTo(b.chest, SPH(D.tipR, 14, 10), M.lime,
          s * D.x, D.tipY - P.y.chest, D.tipZ);
  }
}

for (const side of [-1, 1]) {
  const up = side < 0 ? b.upL : b.upR;
  const fo = side < 0 ? b.foL : b.foR;
  const hd = side < 0 ? b.hdL : b.hdR;

  addTo(up, SPH(P.r.shoulder), M.puffer, 0, 0, 0);
  addLimb(up, L.upperArm, P.r.upperArmTop, P.r.upperArmBot, M.puffer);
  const band1 = addTo(up, TOR(P.r.upperArmTop - 0.00225, 0.0126), M.lime,
                      0, -L.upperArm * 0.30, 0);
  band1.rotation.x = Math.PI / 2;

  addTo(fo, SPH(P.r.elbow), M.puffer, 0, 0, 0);
  addLimb(fo, L.foreArm, P.r.foreArmTop, P.r.foreArmBot, M.puffer);
  const band2 = addTo(fo, TOR(P.r.foreArmBot + 0.00225, 0.0153), M.lime,
                      0, -L.foreArm * 0.75, 0);
  band2.rotation.x = Math.PI / 2;

  addTo(hd, SPH(P.r.hand), M.skin, 0, 0, 0);
}

addTo(b.head, new RoundedBoxGeometry(...P.r.head, 6, 0.081), M.skin, 0, 0, 0);
addTo(b.head, new RoundedBoxGeometry(...P.r.hair, 8, 0.063), M.hair,
      0, P.face.hairY, P.face.hairZ);

b.eyeL = new THREE.Group(); b.eyeL.position.set(-P.face.eyeX, P.face.eyeY, 0); b.head.add(b.eyeL);
b.eyeR = new THREE.Group(); b.eyeR.position.set( P.face.eyeX, P.face.eyeY, 0); b.head.add(b.eyeR);
for (const grp of [b.eyeL, b.eyeR]) {
  addTo(grp, SPH(P.r.eye, 22, 16), M.white, 0, 0, P.face.eyeZ);
  const pupil = addTo(grp, CYL(P.r.pupil, P.r.pupil, 0.0225, 18), M.ink,
                      0, 0, P.face.pupilZ);
  pupil.rotation.x = Math.PI / 2;
  addTo(grp, TOR(P.r.irisR, P.r.irisT, 10, 26), M.lime, 0, 0, P.face.irisZ);
}
for (const s of [-1, 1]) {
  const brow = addTo(b.head, BOX(...P.face.browSize), M.hair,
                     s * P.face.eyeX, P.face.browY, P.face.browZ);
  brow.rotation.z = s * P.face.browTilt;
}
{
  const nose = addTo(b.head, CON(P.face.noseR, P.face.noseH, 18), M.skin,
                     0, P.face.noseY, P.face.noseZ);
  nose.rotation.x = Math.PI / 2;
  addTo(b.head, BOX(...P.face.mouthSize), M.ink, 0, P.face.mouthY, P.face.mouthZ);
}

/* ============================================================
   СИСТЕМА ПОЗ
   ============================================================ */
function emptyPose() {
  return {
    bodyY: 0, bodyRZ: 0,
    hipsX: 0, hipsY: 0, hipsZ: 0,
    chestX: 0, chestY: 0, chestZ: 0,
    neckX: 0, neckY: 0, neckZ: 0,
    headX: 0, headY: 0, headZ: 0,
    hipLX: 0, hipLY: 0, hipLZ: 0,
    hipRX: 0, hipRY: 0, hipRZ: 0,
    shinLX: 0, shinRX: 0,
    footLX: 0, footRX: 0,
    upLX: 0, upLY: 0, upLZ: 0,
    upRX: 0, upRY: 0, upRZ: 0,
    foLX: 0, foRX: 0,
    hdLX: 0, hdRX: 0
  };
}

const POSE_KEYS = Object.keys(emptyPose());

function lerpPose(a, b, k) {
  const out = {};
  for (let i = 0; i < POSE_KEYS.length; i++) {
    const key = POSE_KEYS[i];
    out[key] = a[key] + (b[key] - a[key]) * k;
  }
  return out;
}

function applyPose(p) {
  b.body.position.set(0, p.bodyY, 0);
  b.body.rotation.set(0, 0, p.bodyRZ);

  b.hips .rotation.set(p.hipsX,  p.hipsY,  p.hipsZ);
  b.chest.rotation.set(p.chestX, p.chestY, p.chestZ);
  b.neck .rotation.set(p.neckX,  p.neckY,  p.neckZ);
  b.head .rotation.set(p.headX,  p.headY,  p.headZ);

  b.hipL.rotation.set(p.hipLX, p.hipLY, p.hipLZ);
  b.hipR.rotation.set(p.hipRX, p.hipRY, p.hipRZ);
  b.shinL.rotation.set(p.shinLX, 0, 0);
  b.shinR.rotation.set(p.shinRX, 0, 0);
  b.ftL.rotation.set(p.footLX, 0, 0);
  b.ftR.rotation.set(p.footRX, 0, 0);

  b.upL.rotation.set(p.upLX, p.upLY, p.upLZ);
  b.upR.rotation.set(p.upRX, p.upRY, p.upRZ);
  b.foL.rotation.set(p.foLX, 0, 0);
  b.foR.rotation.set(p.foRX, 0, 0);
  b.hdL.rotation.set(p.hdLX, 0, 0);
  b.hdR.rotation.set(p.hdRX, 0, 0);
}

function kneeOf(phase, A, base) {
  const c = Math.cos(phase);
  return base + 1.5 * A * Math.pow(Math.max(0, c), 0.7);
}

/* ============================================================
   ПОЗЫ — чистые функции, возвращают объект
   ============================================================ */

function poseIdle(t) {
  const p = emptyPose();
  const sway = Math.sin(t * 0.8);

  const hip = 0.02, knee = 0.03;
  p.hipLX = hip; p.hipRX = hip;
  p.shinLX = knee; p.shinRX = knee;
  p.footLX = -hip - knee;
  p.footRX = -hip - knee;

  p.upLX = 0.02; p.upLZ = -0.10;
  p.upRX = 0.02; p.upRZ =  0.10;
  p.foLX = -0.22; p.foRX = -0.22;

  p.hipsY  = sway * 0.02;
  p.chestY = sway * 0.03;
  p.headY  = sway * 0.05;
  p.headZ  = sway * 0.02;

  p.bodyRZ = sway * 0.006;
  return p;
}

function poseGait(t, cfg, isRun) {
  const p = emptyPose();
  const ph  = t * cfg.freq;
  const phL = ph;
  const phR = ph + Math.PI;

  const hipLean = cfg.lean * 0.5;
  p.hipsX = hipLean;
  p.hipsY = Math.sin(ph) * cfg.hipTwist;

  const hipL = Math.sin(phL) * cfg.hipAmp;
  const hipR = Math.sin(phR) * cfg.hipAmp;
  p.hipLX = hipL;
  p.hipRX = hipR;

  const kneeL = kneeOf(phL + Math.PI, cfg.kneeAmp, cfg.baseKnee);
  const kneeR = kneeOf(phR + Math.PI, cfg.kneeAmp, cfg.baseKnee);
  p.shinLX = kneeL;
  p.shinRX = kneeR;

  const rollL = Math.sin(phL) * cfg.footRoll;
  const rollR = Math.sin(phR) * cfg.footRoll;
  p.footLX = rollL - (hipLean + hipL) - kneeL;
  p.footRX = rollR - (hipLean + hipR) - kneeR;

  const armL = Math.sin(phR + 0.15);
  const armR = Math.sin(phL + 0.15);
  p.upLX = armL * cfg.armAmp;  p.upLZ = -0.12;
  p.upRX = armR * cfg.armAmp;  p.upRZ =  0.12;
  p.foLX = cfg.elbowBase - Math.max(0, armL) * cfg.elbowFlex;
  p.foRX = cfg.elbowBase - Math.max(0, armR) * cfg.elbowFlex;
  p.hdLX = isRun ? -0.15 : 0;
  p.hdRX = isRun ? -0.15 : 0;

  p.chestX = cfg.lean;
  p.chestY = -Math.sin(ph) * cfg.bodyTwist;
  p.neckX  = -cfg.lean * 0.6;
  p.headY  = Math.sin(ph) * 0.03;

  p.bodyY  = Math.abs(Math.sin(ph)) * cfg.bob;
  p.bodyRZ = Math.sin(ph) * (isRun ? 0.035 : 0.022);
  return p;
}

function poseJump(phase) {
  const p = emptyPose();

  let bodyY = 0;
  let hip = 0, knee = 0, worldFootTarget = 0;
  let armX = 0, chestX = 0;
  let footLocalOverride = null;

  if (phase < 0.20) {
    const k = phase / 0.20, e = k * k;
    bodyY  = -0.15 * e;
    hip    = -0.55 * e;
    knee   =  0.75 * e;
    armX   = -0.55 * e;
    chestX =  0.18 * e;
  } else if (phase < 0.32) {
    const k = (phase - 0.20) / 0.12;
    const e = 1 - (1 - k) * (1 - k);
    bodyY  = -0.15 * (1 - e) + 0.06 * e;
    hip    = -0.55 * (1 - e) + 0.30 * e;
    knee   =  0.75 * (1 - e) + 0.05 * e;
    worldFootTarget = 0.35 * e;
    armX   = -0.55 * (1 - e) + 1.70 * e;
    chestX =  0.18 * (1 - e) - 0.10 * e;
  } else if (phase < 0.72) {
    const k = (phase - 0.32) / 0.40;
    const arc = Math.sin(k * Math.PI);
    bodyY  = 0.06 + arc * 0.72;
    hip    = 0.30 - arc * 0.55;
    knee   = 0.05 + arc * 0.80;
    footLocalOverride = 0;
    armX   = 1.70 - arc * 0.40;
    chestX = -0.10 + arc * 0.12;
  } else if (phase < 0.88) {
    // ЛЕНДИНГ: стартуем ровно с позы в конце airborne, чтобы не было
    // скачка bodyY/hip/knee/arm — иначе персонаж «отскакивает» в пик дуги.
    const k = (phase - 0.72) / 0.16, e = k * k;
    bodyY  =  0.06  * (1 - e) - 0.15 * e;
    hip    =  0.30  * (1 - e) - 0.28 * e;
    knee   =  0.05  * (1 - e) + 0.85 * e;
    worldFootTarget = 0.35 * (1 - e);
    armX   =  1.70  * (1 - e) - 0.70 * e;
    chestX = -0.10  * (1 - e) + 0.26 * e;
  } else {
    const k = (phase - 0.88) / 0.12;
    const e = 1 - (1 - k) * (1 - k);
    bodyY  = -0.15 * (1 - e);
    hip    = -0.28 * (1 - e);
    knee   =  0.85 * (1 - e);
    armX   = -0.70 * (1 - e);
    chestX =  0.26 * (1 - e);
  }

  p.bodyY  = bodyY;
  p.hipLX  = hip; p.hipRX = hip;
  p.shinLX = knee; p.shinRX = knee;

  if (footLocalOverride !== null) {
    p.footLX = footLocalOverride;
    p.footRX = footLocalOverride;
  } else {
    p.footLX = worldFootTarget - hip - knee;
    p.footRX = worldFootTarget - hip - knee;
  }

  p.upLX = armX; p.upLZ = -0.12;
  p.upRX = armX; p.upRZ =  0.12;
  p.foLX = -0.35; p.foRX = -0.35;
  p.chestX = chestX;
  return p;
}

/* ============================================================
   СОСТОЯНИЕ + HUD
   ============================================================ */
let state = 'idle';
let variant = 0;
let prevState = 'idle';
let prevVariant = 0;
let jumpT = 0;
const JUMP_DUR = 1.5;
const BLEND_IN  = 0.18;
const BLEND_OUT = 0.20;

const hudState = document.getElementById('hud-state');

function updateHud() {
  if (state === 'idle') {
    hudState.textContent = 'idle';
  } else if (state === 'walk') {
    hudState.innerHTML = 'walk <small>· ' + WALKS[variant].name + '</small>';
  } else if (state === 'run') {
    hudState.innerHTML = 'run <small>· ' + RUNS[variant].name + '</small>';
  } else {
    hudState.textContent = 'jump';
  }
}

function setMode(nextState, nextVariant = 0) {
  if (state === 'jump') return;
  state = nextState;
  variant = nextVariant;
  prevState = nextState;
  prevVariant = nextVariant;
  updateHud();
}

function startJump() {
  if (state === 'jump') return;
  prevState = state;
  prevVariant = variant;
  state = 'jump';
  jumpT = 0;
  updateHud();
}

/* ============================================================
   ДЫХАНИЕ / МОРГАНИЕ
   ============================================================ */
function applyBreath(t) {
  const br = Math.sin(t * 1.6) * 0.5 + 0.5;
  b.chest.scale.y = 1 + br * 0.025;
  b.chest.rotation.x += br * 0.018;
  b.neck.rotation.x  += br * 0.010;
  b.body.position.y  += br * 0.0027;             // было 0.006 · 0.45
}

const blink = { nextAt: 1.5 + Math.random() * 3, startAt: -1, duration: 0.14 };
function updateBlink(t) {
  let k = 1;
  if (blink.startAt < 0) {
    if (t >= blink.nextAt) blink.startAt = t;
  } else {
    const q = (t - blink.startAt) / blink.duration;
    if (q >= 1) {
      blink.startAt = -1;
      blink.nextAt = t + 1.8 + Math.random() * 3.2;
    } else {
      const closed = q < 0.5 ? q * 2 : (1 - q) * 2;
      k = 1 - closed * 0.92;
    }
  }
  b.eyeL.scale.y = k;
  b.eyeR.scale.y = k;
}

/* ============================================================
   ВЫБОР ПОЗЫ И СЛОЕНИЕ
   ============================================================ */
function computePoseFor(stateName, variantIdx, t) {
  if (stateName === 'idle') return poseIdle(t);
  if (stateName === 'walk') return poseGait(t, WALKS[variantIdx], false);
  if (stateName === 'run')  return poseGait(t, RUNS[variantIdx],  true);
  return emptyPose();
}

function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function animateCharacter(t, dt) {
  let pose;

  if (state === 'jump') {
    jumpT += dt;
    const phase = Math.min(1, jumpT / JUMP_DUR);

    const basePose = computePoseFor(prevState, prevVariant, t);
    const jumpPose = poseJump(phase);

    const wIn  = smoothstep(0, BLEND_IN, jumpT);
    const wOut = smoothstep(0, BLEND_OUT, JUMP_DUR - jumpT);
    const w = Math.min(wIn, wOut);

    pose = lerpPose(basePose, jumpPose, w);

    if (phase >= 1) {
      jumpT = 0;
      state = prevState;
      variant = prevVariant;
      updateHud();
    }
  } else {
    pose = computePoseFor(state, variant, t);
  }

  applyPose(pose);
  applyBreath(t);
  updateBlink(t);
}

/* ============================================================
   УПРАВЛЕНИЕ
   ============================================================ */
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); startJump(); return; }
  if (e.key === '0') { setMode('idle'); return; }
  if (e.key >= '1' && e.key <= '5') { setMode('walk', parseInt(e.key, 10) - 1); return; }
  if (e.key >= '6' && e.key <= '9') { setMode('run',  parseInt(e.key, 10) - 6); return; }

  if (e.key === '+' || e.key === '=') {
    P.scale = Math.min(2.0, P.scale + 0.1);
    b.body.scale.setScalar(P.scale);
  }
  if (e.key === '-' || e.key === '_') {
    P.scale = Math.max(0.4, P.scale - 0.1);
    b.body.scale.setScalar(P.scale);
  }
  if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
    P.scale = 1.0;
    b.body.scale.setScalar(P.scale);
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let lastT = 0;

renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  animateCharacter(t, dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
