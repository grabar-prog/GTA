<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Meridian · diagnostics</title>
<style>
  html,body{margin:0;padding:0;background:#0e141c;color:#dfe9f4;
    font:13px/1.55 ui-monospace,Menlo,Consolas,monospace}
  #out{padding:20px 24px;max-width:1400px;margin:0 auto}
  h1{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#5fd0ff;margin:0 0 12px}
  .row{padding:8px 12px;border-left:3px solid #2a3a4a;margin:6px 0;background:#131c26;
    border-radius:4px;white-space:pre-wrap;font-size:12.5px;line-height:1.5}
  .ok{border-left-color:#5fe0a0;color:#b8dcc8}
  .warn{border-left-color:#ffb454;color:#e8d0a8}
  .err{border-left-color:#ff6b6b;color:#f0b0b0}
  .head{color:#8ea3b8;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:18px 0 4px}
  pre{margin:0;white-space:pre-wrap;word-break:break-word}
  #summary{padding:12px 16px;background:#16202c;border-radius:6px;margin-bottom:16px;
    font-size:12px;color:#dfe9f4}
  #summary b{color:#5fd0ff}
</style>
</head>
<body>
<div id="out">
  <h1>Meridian · diagnostics</h1>
  <div id="summary">Загрузка…</div>
  <div id="list"></div>
</div>

<!-- ядро: геометрия, каталог, день/ночь -->
<script src="./geom.js"></script>
<script src="./asset-registry.js"></script>
<script src="./day-cycle.js"></script>

<!-- модели: manifest.js перечисляет файлы, _loader.js вставляет их в поток парсинга -->
<script src="./models/manifest.js"></script>
<script src="./models/_loader.js"></script>

<!-- фабрика машин: стоит после моделей, т.к. читает MeridianCarKit/BusKit/SemiKit -->
<script src="./vehicles.js"></script>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const out = document.getElementById('list');
const summary = document.getElementById('summary');

function line(cls, text) {
  const el = document.createElement('div');
  el.className = 'row ' + cls;
  el.appendChild(document.createTextNode(text));
  out.appendChild(el);
}
function head(text) {
  const el = document.createElement('div');
  el.className = 'head';
  el.textContent = text;
  out.appendChild(el);
}

function boot() {
  /* ---------- 1. Глобальные модули ---------- */
  head('1. Глобальные модули');
  const checks = [
    ['MeridianGeom',            () => window.MeridianGeom && typeof MeridianGeom.createKit === 'function'],
    ['MeridianAssets',          () => window.MeridianAssets && typeof MeridianAssets.list === 'function'],
    ['MeridianDayCycle',        () => window.MeridianDayCycle && typeof MeridianDayCycle.create === 'function'],
    // MeridianTrafficAI здесь не проверяем: это игровой модуль,
    // он работает с cars/lanes и в viewer/diagnostic не подключается.
    ['MainPerson',              () => window.MainPerson && typeof MainPerson.createHero === 'function'],
    ['MeridianPedestrians',     () => window.MeridianPedestrians && typeof MeridianPedestrians.createFactory === 'function'],
    ['MeridianVehicles',        () => window.MeridianVehicles && typeof MeridianVehicles.createFactory === 'function'],
    ['MeridianBuildingKit',     () => window.MeridianBuildingKit && typeof MeridianBuildingKit.add === 'function'],
    ['MeridianTreeKit',         () => window.MeridianTreeKit && typeof MeridianTreeKit.build === 'function'],
    ['MeridianStreetlightKit',  () => window.MeridianStreetlightKit && typeof MeridianStreetlightKit.build === 'function'],
    ['MeridianParkKit',         () => window.MeridianParkKit && typeof MeridianParkKit.add === 'function'],
    ['MeridianRoadKit',         () => window.MeridianRoadKit && typeof MeridianRoadKit.buildAll === 'function'],
    ['MeridianDistantCityKit',  () => window.MeridianDistantCityKit && typeof MeridianDistantCityKit.build === 'function'],
    ['MeridianCarKit',          () => window.MeridianCarKit && typeof MeridianCarKit.makeGeometry === 'function'],
    ['MeridianBusKit',          () => window.MeridianBusKit && typeof MeridianBusKit.makeGeometry === 'function'],
    ['MeridianSemiKit',         () => window.MeridianSemiKit && typeof MeridianSemiKit.makeGeometry === 'function'],
  ];
  let okCount = 0;
  for (const [name, check] of checks) {
    try {
      if (check()) { line('ok', '✓ ' + name); okCount++; }
      else         { line('err', '✗ ' + name + ' — not defined or wrong shape'); }
    } catch (e) {
      line('err', '✗ ' + name + ' — ' + (e && e.message || e));
    }
  }

  /* ---------- 2. Каталог ---------- */
  head('2. Записи в MeridianAssets');
  let entries = [];
  try {
    entries = MeridianAssets.list();
    line('ok', 'Зарегистрировано записей: ' + entries.length);
    for (const e of entries) {
      line('ok', '  · ' + e.id + '  (' + (e.group || '—') + ')  «' + e.label + '»');
    }
  } catch (e) {
    line('err', 'MeridianAssets.list() упал: ' + (e && e.message || e));
    return;
  }

  /* ---------- 3. Прогон makePreview ---------- */
  head('3. Прогон makePreview (как в viewer.html)');
  const geom = MeridianGeom.createKit({ THREE });
  const ctx = { THREE, RoundedBoxGeometry, geom };
  let okPreviews = 0, failPreviews = 0;

  for (const entry of entries) {
    try {
      const t0 = performance.now();
      const obj = entry.makePreview(ctx);
      const t1 = performance.now();

      if (!obj) {
        line('err', '✗ ' + entry.id + ' — makePreview вернул ' + String(obj));
        failPreviews++;
        continue;
      }
      if (typeof obj.traverse !== 'function') {
        line('err', '✗ ' + entry.id + ' — returned object не имеет .traverse() (тип ' + obj.type + ')');
        failPreviews++;
        continue;
      }

      let meshes = 0, instances = 0, nanSeen = false, nanWhere = '';
      obj.traverse(o => {
        if (o.isMesh || o.isInstancedMesh) meshes++;
        if (o.isInstancedMesh) instances += o.count;
        if (o.geometry && o.geometry.attributes && o.geometry.attributes.position) {
          const arr = o.geometry.attributes.position.array;
          for (let i = 0; i < Math.min(arr.length, 30000); i++) {
            if (!Number.isFinite(arr[i])) {
              nanSeen = true;
              nanWhere = (o.name || o.type) + ' pos[' + i + ']=' + arr[i];
              break;
            }
          }
        }
      });

      const box = new THREE.Box3().setFromObject(obj);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const sizeOk = Number.isFinite(size.x) && Number.isFinite(size.y) && Number.isFinite(size.z);
      const centerOk = Number.isFinite(center.x) && Number.isFinite(center.y) && Number.isFinite(center.z);

      const ms = (t1 - t0).toFixed(1);
      let status = 'ok';
      let extra = '';
      if (!sizeOk || !centerOk) { status = 'err'; extra = '  ← bounds = NaN'; }
      else if (nanSeen)         { status = 'err'; extra = '  ← NaN в геометрии: ' + nanWhere; }
      else if (size.x * size.y * size.z < 1e-6) { status = 'warn'; extra = '  ← нулевой bounding box'; }
      else if (meshes === 0)    { status = 'warn'; extra = '  ← ни одного mesh'; }

      if (status === 'err') failPreviews++; else okPreviews++;
      line(status,
        (status === 'err' ? '✗ ' : status === 'warn' ? '· ' : '✓ ') +
        entry.id +
        '  meshes=' + meshes +
        (instances ? ' instances=' + instances : '') +
        '  size=' + size.x.toFixed(1) + '×' + size.y.toFixed(1) + '×' + size.z.toFixed(1) +
        '  ' + ms + 'ms' + extra
      );
    } catch (e) {
      failPreviews++;
      const msg = (e && e.message) || String(e);
      const stack = (e && e.stack) ? '\n' + e.stack.split('\n').slice(0,4).join('\n') : '';
      line('err', '✗ ' + entry.id + ' — THROWN: ' + msg + stack);
    }
  }

  /* ---------- Итог ---------- */
  head('Итог');
  const el = document.getElementById('summary');
  el.innerHTML = '<b>Модулей OK:</b> ' + okCount + '/' + checks.length +
                 ' &nbsp;·&nbsp; <b>makePreview:</b> ' +
                 '<span style="color:#5fe0a0">' + okPreviews + ' ok</span>, ' +
                 '<span style="color:#ff6b6b">' + failPreviews + ' ошибок</span>';
}

try { boot(); }
catch (e) {
  line('err', 'boot() упал: ' + (e && e.message || e));
  line('err', (e && e.stack || '').split('\n').slice(0,8).join('\n'));
}
</script>
</body>
</html>
